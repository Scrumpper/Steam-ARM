name: Bug report
description: Report a problem with steam-arm-setup.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This project is tested on one device only, an RK3588 board with a Mali-G610 GPU on an Armbian based image. Steam ARM report below holds hardware, versions and settings, so no hand-typed system details are needed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What was expected
      description: Describe what should have happened instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command run
      description: Paste the exact command line, including any --select, --skip, or --defaults flags. Leave empty when no command was involved.
      placeholder: sudo steam-arm-setup --defaults
    validations:
      required: false
  - type: textarea
    id: steam-arm-report
    attributes:
      label: Steam ARM report
      description: |
        Problem with a game: run "steam-arm-config report run" (or menu: Maintenance, Report how last game ran) right after the game start, then paste the saved file. Problem without a game: run "steam-arm-config report" and paste ~/steam-arm-report.txt.
        Reports contain no account names, host names, addresses or Steam IDs; read before posting.
    validations:
      required: true
  - type: checkboxes
    id: acknowledge
    attributes:
      label: Acknowledgement
      options:
        - label: "Confirmed: this project is tested on one device only, and the hardware used for this report may not have been verified."
          required: true
