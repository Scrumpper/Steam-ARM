name: Compatibility report
description: Report a device that works, or does not work, with steam-arm-setup.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        This form collects the data used to maintain COMPATIBILITY.md. Steam ARM report below holds board, GPU, driver, distribution, page size and installed parts; precise answers to the questions are more useful than long descriptions.
  - type: input
    id: device
    attributes:
      label: Device
      description: Board, machine, or product name (for search).
    validations:
      required: true
  - type: textarea
    id: steam-arm-report
    attributes:
      label: Steam ARM report
      description: |
        Run "steam-arm-config report run" (or menu: Maintenance, Report how last game ran) after a game start and paste the saved file. No game started yet: run "steam-arm-config report" and paste ~/steam-arm-report.txt.
        Reports contain no account names, host names, addresses or Steam IDs; read before posting.
    validations:
      required: true
  - type: dropdown
    id: client-started
    attributes:
      label: Did the Steam client start
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: true
  - type: dropdown
    id: native-title
    attributes:
      label: Did a Linux native title run
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: true
  - type: dropdown
    id: proton-title
    attributes:
      label: Did a Windows title through Proton run
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: true
  - type: dropdown
    id: remote-play
    attributes:
      label: Was Remote Play tried
      options:
        - "Yes, it worked"
        - "Yes, it did not work"
        - Not tried
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else relevant, such as titles tested, error messages, or workarounds found.
    validations:
      required: false
